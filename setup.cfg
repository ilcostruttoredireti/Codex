[metadata]
name = gmail_hubspot_sync
version = 1.0.0
description = Monitor Gmail inbound emails and sync senders as contacts in HubSpot

[options]
packages = gmail_hubspot_sync
python_requires = >=3.10
install_requires =
    google-api-python-client>=2.120.0
    google-auth>=2.28.0
    google-auth-httplib2>=0.2.0
    google-auth-oauthlib>=1.2.0
    requests>=2.31.0
    python-dotenv>=1.0.0

[options.entry_points]
console_scripts =
    gmail-hubspot-sync = gmail_hubspot_sync.main:run
